name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and packager
        run: python -m pip install -e ".[desktop]"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: powershell
        run: .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: REDCap-Export-Explorer-Windows-Portable-x64
          path: dist/REDCapExportExplorer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: REDCap-Export-Explorer-Windows-x64
          path: dist/installer/*.exe

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and packager
        run: python -m pip install -e '.[desktop]'
      - name: Build macOS installer
        run: PYTHON_BIN=python sh packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: REDCap-Export-Explorer-macOS-arm64
          path: dist/*.pkg
