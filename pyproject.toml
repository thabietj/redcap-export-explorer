[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redcap-export-explorer"
version = "0.3.1"
description = "Privacy-preserving local exploration and export of REDCap datasets"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0", "streamlit>=1.35", "openpyxl>=3.1", "pyreadstat>=1.2",
  "pydantic>=2.0", "PyYAML>=6.0", "charset-normalizer>=3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
